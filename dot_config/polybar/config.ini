[colors]
background = #282A36
background-alt = #44475A
foreground = #F8F8F2
foreground-dim = #BFBFBF
purple = #BD93F9
green = #50FA7B
cyan = #8BE9FD
orange = #FFB86C
pink = #FF79C6
yellow = #F1FA8C
red = #FF5555
blue = #6272A4

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "NotoSansM Nerd Font Mono:size=11;4"
font-1 = "NotoSansM Nerd Font Mono:size=16;5"
font-2 = "NotoSansM Nerd Font Mono:size=13;4"
padding-left = 0
padding-right = 1
module-margin = 0
line-size = 3

modules-left = i3
modules-center = date
modules-right = disk sep2 memory sep2 cpu sep2 cpu-temp sep2 gpu-temp sep3 keyboard sep2 pulseaudio sep3 powermenu sep2 tray

[module/sep]
type = custom/text
content = "  "

[module/sep2]
type = custom/text
content = " "

[module/sep3]
type = custom/text
content = "  "

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
label-focused = %{T2}%name%%{T-}
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.purple}
label-focused-padding = 2
label-unfocused = %{T2}%name%%{T-}
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.blue}
label-urgent = %{T2}%name%%{T-}
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding = 2
label-visible = %{T2}%name%%{T-}
label-visible-padding = 2

[module/launcher-terminal]
type = custom/text
content = "TRM"
content-foreground = ${colors.purple}
content-padding = 1
click-left = ghostty &

[module/launcher-browser]
type = custom/text
content = "WEB"
content-foreground = ${colors.orange}
content-padding = 1
click-left = brave &

[module/launcher-files]
type = custom/text
content = "FIL"
content-foreground = ${colors.cyan}
content-padding = 1
click-left = thunar ~/ &

[module/launcher-mail]
type = custom/text
content = "MAIL"
content-foreground = ${colors.yellow}
content-padding = 1
click-left = betterbird &

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
label-mounted =  %percentage_used%%
label-mounted-foreground = ${colors.cyan}
label-unmounted =  ?

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used%%
label-foreground = ${colors.green}

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage%%
label-foreground = ${colors.purple}

[module/cpu-temp]
type = internal/temperature
interval = 5
hwmon-path = /sys/class/hwmon/hwmon5/temp1_input
label = %temperature-c%
label-foreground = ${colors.orange}
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

[module/gpu-temp]
type = internal/temperature
interval = 5
hwmon-path = /sys/class/hwmon/hwmon7/temp1_input
label = GPU %temperature-c%
label-foreground = ${colors.pink}
label-warn = GPU %temperature-c%
label-warn-foreground = ${colors.red}

[module/pulseaudio]
type = internal/pulseaudio
label-volume =  %percentage%%
label-volume-foreground = ${colors.cyan}
label-muted =  muted
label-muted-foreground = ${colors.blue}
click-left = pavucontrol &

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M:%S
label = %{T2}%{T-}  %date%   %{T2}%{T-}  %time%
label-foreground = ${colors.foreground}

[module/keyboard]
type = internal/xkeyboard
label-layout = %{T2}%{T-} %layout%
label-layout-foreground = ${colors.yellow}

[module/powermenu]
type = custom/text
content = "%{T2}⏻%{T-}"
content-foreground = ${colors.red}
content-padding = 1
click-left = ~/.config/i3/scripts/powermenu &

[module/tray]
type = internal/tray
tray-size = 16
tray-padding = 4
tray-spacing = 4
